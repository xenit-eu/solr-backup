apply plugin: 'java'
apply plugin: 'idea'
apply plugin: 'eu.xenit.docker'
apply plugin: 'eu.xenit.docker-compose.auto'

ext {
    solrVersion = '6.6.5'
    assVersion = '2.0.6'
    solrBaseImage = 'docker.io/xenit/alfresco-solr6-xenit:2.0.6'
    alfrescoimage = 'docker.io/xenit/alfresco-repository-community:7.3.0'
    flavor = 'solr6'
}


description = "Solr ${flavor} with backup"

configurations {
    backupJar
}

dependencies {
    backupJar project(path: ":solr-backup")

    testImplementation "io.rest-assured:rest-assured:${restAssuredVersion}"
    testImplementation "io.rest-assured:json-path:${restAssuredVersion}"
    testImplementation "io.rest-assured:rest-assured-common:${restAssuredVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-engine:${junitJupiterVersion}"
    testImplementation "org.junit.jupiter:junit-jupiter-params:${junitJupiterVersion}"
    testImplementation "org.awaitility:awaitility:${awaitablityVersion}"

    testImplementation platform("software.amazon.awssdk:bom:${amazonVersion}")

    testImplementation('software.amazon.awssdk:aws-core')
    testImplementation('software.amazon.awssdk:s3')
    testImplementation("software.amazon.awssdk:sts")

    testImplementation "software.amazon.awssdk:apache-client:${amazonVersion}"

    testImplementation "software.amazon.awssdk:netty-nio-client:${amazonVersion}"

    testRuntimeOnly "org.glassfish.jaxb:jaxb-runtime:${jaxBVersion}"
}
test {
    useJUnitPlatform()
}

createDockerFile {
    from "${solrBaseImage}"

    dependsOn(configurations.backupJar)

    if (flavor == "solr6") {
        smartCopy "${project.projectDir}/src/test/resources/solr.xml", "/opt/alfresco-search-services/solrhome/solr.xml"
        // The base image bundles an older (AWS SDK 1.x) solr-backup.jar with the same classes as the jar built here,
        // and Solr loads whichever of the two the filesystem lists first. Only that jar is removed, not the SDK 1.x jars.
        runCommand "rm -f /opt/alfresco-search-services/solrhome/lib/solr-backup.jar"
        smartCopy configurations.backupJar, "/opt/alfresco-search-services/solrhome/lib/"
        // Fail the image build unless exactly one jar provides the repository class
        runCommand '''n=$(for j in /opt/alfresco-search-services/solrhome/lib/*.jar; do unzip -Z1 "$j" | grep -Fxq 'eu/xenit/solr/backup/s3/S3BackupRepository.class' && echo "$j"; done | wc -l); [ "$n" -eq 1 ] || { echo "Expected exactly one jar in solrhome/lib with S3BackupRepository, found $n" >&2; exit 1; }'''
    }
}

dockerCompose {
    environment.put 'ALFRESCO_IMAGE', project.alfrescoimage
    useComposeFiles = [
            "${project.projectDir}/src/test/resources/compose/docker-compose.yml"
    ]
        isRequiredBy(project.tasks.test)
    // Container logs (e.g. of Solr) are removed with the containers. Under build/reports so that CI uploads them.
    captureContainersOutputToFiles = layout.buildDirectory.dir("reports/containers").get().asFile
}
